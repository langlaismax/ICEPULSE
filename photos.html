<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>IcePulse — Photos</title>
  <style>
    :root{
      --pro-bg:#f7f9fc;
      --pro-surface:#ffffff;
      --pro-surface-2:#fbfdff;
      --pro-card:#ffffff;
      --pro-text:#111318;
      --pro-muted:#5f6672;
      --pro-border:#e7ecf3;
      --pro-accent:#0f6fff;
      --pro-accent-2:#58b6ff;
      --pro-radius:12px;
      --pro-shadow:0 10px 30px rgba(14,30,65,.08);
    }

    html,body{background:var(--pro-bg);color:var(--pro-text);margin:0;padding:18px;font-family:Inter,system-ui,Arial}
    .wrap{max-width:1180px;margin:0 auto}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .logo{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pro-accent),var(--pro-accent-2));color:#fff;padding:8px 12px;border-radius:10px}
    .logo h1{margin:0;font-size:1rem}
    .muted{color:var(--pro-muted)}

    /* Card */
    .card{
      background: var(--pro-card);
      border: 1px solid var(--pro-border);
      border-radius: var(--pro-radius);
      box-shadow: var(--pro-shadow);
      padding:14px;
      margin-bottom:12px;
    }

    /* Inputs/Buttons */
    select,button{
      background:#fff;
      color:var(--pro-text);
      border:1px solid var(--pro-border);
      border-radius:10px;
      padding:10px 12px;
      font-size:16px;
    }
    button.nav{
      background:linear-gradient(180deg,var(--pro-accent),var(--pro-accent-2));
      color:#fff;
      border:none;
      box-shadow:0 8px 20px rgba(15,111,255,.18);
      font-weight:600;
      cursor:pointer;
    }
    .nav-row{display:flex;gap:8px;margin-left:auto}
    .nav-row a{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 12px;border-radius:10px;border:1px solid var(--pro-border);
      text-decoration:none;color:#111;background:#fff;font-weight:600;
    }
    .nav-row a.active{background:linear-gradient(180deg,var(--pro-accent),var(--pro-accent-2));color:#fff;border:none;box-shadow:0 8px 20px rgba(15,111,255,.18)}

    /* Gallery iframe wrapper */
    .iframe-rail{
      border:1px solid var(--pro-border);
      border-radius:10px;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--pro-shadow);
    }
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    @media (max-width:600px){
      html,body{padding:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l3.5 7H8.5L12 2zM4 21h16l-8-8-8 8z" fill="white"/></svg>
        <h1>IcePulse — Photos</h1>
      </div>
      <div class="nav-row">
        <a href="index.html">Index</a>
        <a href="calc.html">Calc</a>
        <a class="active" href="photos.html">Photos</a>
      </div>
    </header>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <label for="folderSelect" class="muted">Choose folder</label>
          <select id="folderSelect" aria-label="Choose Google Drive folder">
            <option value="1vZdQmd5tPDSQfdxYVcTAWy6BpfLJPq-X">Ads / Postcards</option>
            <option value="1QkYLCa8CKJJ_QDKsHjzQYySLceRvu_Wd">Broomheads</option>
            <option value="1gF1A4MkXvm5eksud9cuTHT5C1GddkMAK">Brooms</option>
            <option value="1kVxYmsLB6SZRPcV321pp-Xwy6qxTqCOB">Cartoons</option>
            <option value="1oqBiuYARss5Rnf0wjJMwphThld35ULsz">Curlers in B&amp;W</option>
            <option value="1nxizWsd2gCwtHFps8N3hYQz0a1583Th9">Curlers in Color</option>
            <option value="1n-9DudDQIHiqcNjfwRecmiepjzY7yJcS">Dated 1855–2000</option>
            <option value="1eQxjpZp020KiAdKj8LhX9MrcxgqVq1kW">Olympics</option>
            <option value="1HBHTfbNSb68fQR_97H4U5agf8ahqzzR4">Paintings 1626–1908</option>
            <option value="1_zlJSqaHNEtCLetYPliHd8pusenXL3q6">Stabilizer / Stick</option>
            <option value="1yOPb2e-eP0b134zhQszcUFGL0xWb6Amg">Stones</option>
            <option value="1n2LylOnTR8J39dQ2J32WwjKTA2Ts0bCR">Sweeping</option>
            <option value="1j9SzZuduC72No6gJoLzv1GbKG3U36zEz">Woodcut</option>
          </select>
        </div>
        <div class="muted" id="hint">Tip: All folders must be set to “Anyone with the link — Viewer”.</div>
      </div>
    </section>

    <section class="card">
      <div class="iframe-rail">
        <!-- Embedded Google Drive folder view; we swap the id via JS -->
        <iframe id="galleryFrame" src="" style="width:100%; height:78vh; border:0" title="Gallery"></iframe>
      </div>
    </section>
  </div>

  <script>
    // Build a Drive "embeddedfolderview" URL for a given folder id.
    // We use the #grid view to show thumbnails; #list is also available.
    function folderIdToEmbedUrl(id){
      return "https://drive.google.com/embeddedfolderview?id=" + encodeURIComponent(id) + "#grid";
    }

    const select = document.getElementById('folderSelect');
    const frame  = document.getElementById('galleryFrame');

    function applyFromSelect(){
      const id = select.value;
      const url = folderIdToEmbedUrl(id);
      frame.src = url;
      // Persist in URL so it’s shareable/bookmarkable
      const params = new URLSearchParams(location.search);
      params.set('id', id);
      history.replaceState(null, '', location.pathname + '?' + params.toString());
    }

    // On load: honor ?id=... if present
    (function onLoad(){
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if(id){
        // If id is in our options, select it
        for(const opt of select.options){ if(opt.value === id){ select.value = id; break; } }
      }
      applyFromSelect();
    })();

    select.addEventListener('change', applyFromSelect);
  </script>
</body>
</html>
