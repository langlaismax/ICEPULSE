<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IcePulse</title>
  <style>
    :root{
      --bg:#f7f9fc; --card:#fff; --text:#111; --muted:#6b7280;
      --accent:#0f6fff; --accent2:#58b6ff; --radius:14px; --shadow:0 8px 20px rgba(15,111,255,.18);
    }
    body{margin:0; font-family:Inter,system-ui,Arial; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center;}
    img{width:160px; height:auto; margin-bottom:20px;}
    h1{font-size:1.8rem; margin:0;}
    p{color:var(--muted); margin-top:8px; font-size:1.1rem;}
    .links{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:36px; width:100%; max-width:1080px;}
    a{
      display:block; padding:16px 18px; background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:#fff; font-weight:600; text-decoration:none; border-radius:var(--radius);
      box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s;
    }
    a:hover{transform:translateY(-3px); box-shadow:0 10px 25px rgba(15,111,255,.28);}
    footer{margin-top:40px; font-size:.9rem; color:var(--muted);}
  </style>
</head>
<body>
  <img src="icepulselogo.png" alt="IcePulse logo" />
  <h1>IcePulse</h1>
  <p>Open Source Curling</p>
  <div class="links">
	<a href="index_archive.html">Archive</a>
	<a href="blogs.html">Blogs</a>
	<a href="drill.html">Highscores</a>
	<a href="calcs.html">Tools</a>
  </div>
  <footer></footer>
</body>
</html>
