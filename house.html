<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Curling House – Pro</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<style>/* === Pro Light Skin + Snazzy Polish === */
:root{
  --pro-bg:#f7f9fc; --pro-surface:#ffffff; --pro-surface-2:#fbfdff;
  --pro-card:#ffffff; --pro-text:#111318; --pro-muted:#5f6672;
  --pro-border:#e7ecf3; --pro-accent:#0f6fff; --pro-accent-2:#58b6ff;
  --pro-radius:12px; --pro-shadow:0 10px 30px rgba(14,30,65,.08);
  --bg:#f6f8fa; --card:#fff; --muted:#6b7280; --text:#111827; --border:#e7ecf3;
}

html,body{background:var(--pro-bg);color:var(--pro-text)}
body{margin:18px;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,var(--pro-bg),#f2f4f6)}

/* Shell */
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.logo{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pro-accent),var(--pro-accent-2));color:#fff;padding:10px 12px;border-radius:12px}
.logo h1{margin:0;font-size:1rem;line-height:1}
.muted{color:var(--pro-muted)}
.muted-xs{color:var(--pro-muted);font-size:0.86rem}

/* Cards & rails */
.card,.panel,section.card,.box{background:var(--pro-card);border:1px solid var(--pro-border);border-radius:var(--pro-radius);box-shadow:var(--pro-shadow)}
.card{padding:14px;margin-bottom:12px}
.p-0{padding:0}
.table-wrap-auto,.h-scroll{border:1px solid var(--pro-border);border-radius:10px;overflow:auto;background:#fff;box-shadow:var(--pro-shadow)}

/* Inputs */
input,select,textarea{
  background:#fff;color:var(--pro-text);border:1px solid var(--pro-border);
  border-radius:10px;padding:10px 12px;font-size:0.95rem;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--pro-accent);box-shadow:0 0 0 3px rgba(15,111,255,.18);outline:0}
select[multiple]{min-height:82px}

/* Buttons */
button,.btn,.button{
  border-radius:10px;border:1px solid var(--pro-border);
  background: linear-gradient(180deg, var(--pro-accent), var(--pro-accent-2));
  color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(15,111,255,.18);
  padding:10px 12px;cursor:pointer;transition:transform .05s ease;
}
button:active,.btn:active{transform:translateY(1px)}
.alt,.btn.secondary,.ghost,.outline{background:#fff;color:var(--pro-text);box-shadow:none}

/* Pills */
.pill{padding:6px 12px;border:1px solid var(--pro-border);border-radius:999px;background:#fbfdff;cursor:pointer;font-weight:600;color:var(--pro-text)}
.pill.active{background:linear-gradient(180deg,var(--pro-accent),var(--pro-accent-2));color:#fff;border:none;box-shadow:0 8px 20px rgba(15,111,255,.18)}

/* Layout helpers */
.row{display:grid;grid-template-columns: repeat(10, 1fr); gap: 1px}
.row>*{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.inline{display:flex;align-items:center;gap:10px}
.right{text-align:right}
.hr{height:1px;background:var(--pro-border);margin:14px auto;max-width:100%}

/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:0.92rem}
td,th{padding:10px 12px;border-bottom:1px solid var(--pro-border);white-space:nowrap;text-align:left}
thead th{position:sticky;top:0;background:var(--pro-surface);color:var(--pro-muted);font-weight:600;font-size:12px;text-transform:uppercase}
tbody tr:nth-child(odd) td{background:#fafbfe}

/* Highlights */
td.cell-best-est{background: linear-gradient(90deg,#ffe5b4,#ffcf6b)!important;color:#111!important;font-weight:700;border-radius:6px}
td.cell-best-player{background: linear-gradient(90deg,#bff3d0,#50d88a)!important;color:#022!important;font-weight:700;border-radius:6px}

.nav-row{display:flex;gap:8px;margin-left:auto}
.nav-row a{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 12px;border-radius:10px;border:1px solid var(--pro-border);
  text-decoration:none;color:#111;background:#fff;font-weight:600;
}

/* Canvas stage */
.stage-card{position:relative}
#houseCanvas{display:block}
#overlayCanvas{position:absolute;inset:0;pointer-events:auto}

/* Toolbar */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0;padding:10px 12px;background:var(--pro-card);border-top:1px solid var(--pro-border)}
.toolbar-sticky{position:sticky;top:8px;z-index:5;border:1px solid var(--pro-border);border-radius:12px;box-shadow:var(--pro-shadow)}

/* Mobile */
@media (max-width:1000px){ .row{grid-template-columns:repeat(3,1fr)} }
@media (max-width:700px){ .row{grid-template-columns:repeat(2,1fr)} }
@media (max-width:900px){ #constraintsContainer{overflow-x:auto} #constraints{min-width:720px} }
@media (max-width:600px){
  .wrap{margin:12px} body{margin:12px}
  .grid2{grid-template-columns:1fr}
}

/* Two-column layout: controls left, stage right */
.two-col{display:grid;grid-template-columns:minmax(330px,1fr) minmax(330px,auto);gap:14px;align-items:start}
@media (max-width: 980px){ .two-col{grid-template-columns:1fr} }

/* Stage container keeps intrinsic canvas size, no CSS scaling */
.stage{position:relative;width:max-content;margin:0 auto}

/* Compact zone percentage inputs */
input.zoneInput[type="number"]{ width:5ch; min-width:5ch; text-align:right; }
@media (max-width: 520px){
  input.zoneInput[type="number"]{ width:7ch; min-width:7ch; }
}
</style>
</head>

<script>
  (() => {
    const byId = (id) => document.getElementById(id);
    const house = byId('houseCanvas');
    const overlay = byId('overlayCanvas');
    const octx = overlay.getContext('2d');

    function syncOverlaySize() {
      overlay.width = house.width;
      overlay.height = house.height;
    }
    syncOverlaySize();
    window.addEventListener('load', syncOverlaySize);

    // === Config helpers ===
    function getConfig() {
      try { return JSON.parse(byId('scenario_config').value); }
      catch { return { coordinates: [], scale: 28, stone_colours: ['Red','Yellow'] }; }
    }
    function setConfig(cfg) {
      byId('scenario_config').value = JSON.stringify(cfg, null, 2);
    }
    function currentColours() {
      const sel = byId('stoneColours');
      const parts = sel ? sel.value.split('/').map(s => s.trim()) : ['Red','Yellow'];
      return parts.length === 2 ? parts : ['Red','Yellow'];
    }
    function getScale() { const cfg = getConfig(); return Number(cfg.scale || 28); }
    function tee() { return { cx: house.width / 2, cy: house.width / 2 }; }
    function stoneRadius() { return getScale() * 0.48; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function dist(x1,y1,x2,y2){ const dx=x1-x2, dy=y1-y2; return Math.hypot(dx,dy); }

    // === GRID OVERLAY ===
    function drawGrid() {
      syncOverlaySize();
      octx.clearRect(0,0,overlay.width, overlay.height);
      if (!byId('toggle-grid').checked) return;

      const scale = getScale();
      const {cx, cy} = tee();

      octx.save();
      octx.globalAlpha = 0.55;
      octx.lineWidth = 1;
      octx.strokeStyle = '#6aa3ff';
      octx.fillStyle = '#1a1a1a';

      for (let n = Math.floor(-cx/scale); n <= Math.ceil((overlay.width-cx)/scale); n++) {
        const x = Math.round(cx + n*scale);
        octx.beginPath(); octx.moveTo(x, 0); octx.lineTo(x, overlay.height); octx.stroke();
        octx.font = '11px system-ui, sans-serif'; octx.textAlign='center';
        octx.fillText(n.toString(), x, 12);
      }
      for (let n = Math.floor(-cy/scale); n <= Math.ceil((overlay.height-cy)/scale); n++) {
        const y = Math.round(cy + n*scale);
        octx.beginPath(); octx.moveTo(0, y); octx.lineTo(overlay.width, y); octx.stroke();
        octx.textAlign='left';
        octx.fillText(n.toString(), 4, y-2);
      }

      octx.strokeStyle = '#000';
      octx.beginPath(); octx.moveTo(cx-6, cy); octx.lineTo(cx+6, cy); octx.stroke();
      octx.beginPath(); octx.moveTo(cx, cy-6); octx.lineTo(cx, cy+6); octx.stroke();

      octx.restore();
    }
    byId('toggle-grid').addEventListener('change', drawGrid);
    drawGrid();

    // ---- Single source of truth for the textarea ----
    window.mirrorScenarioToEditor = function () {
      try {
        const cfg = getConfig();
        manual = (cfg.coordinates || []).slice();
        updateCount(); // writes textarea (with dedupe+sort)
      } catch {}
    };

    overlay.addEventListener('mousemove', (e) => {
      const rect = overlay.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const {cx, cy} = tee();
      const s = getScale();
      const xf = ((x-cx)/s).toFixed(2);
      const yf = ((y-cy)/s).toFixed(2);
      byId('cursor-ft').textContent = `x: ${xf} ft, y: ${yf} ft`;
    });

    // === MANUAL EDITOR ===
    let manual = [];
    let placeEnabled = false;
    let nextColour = 'Red';

    // ---------- NEW: Dedupe + Sort utilities ----------
// Max rock number to enforce (Yellow/Red 1..8)
const MAX_ROCK_NUM = 8;

function colourName(s, cols){
  return cols[s.colour_index] || (s.colour_index === 1 ? 'Yellow' : 'Red');
}

function usedNumsByColour(stones){
  const cols = currentColours();
  const map = { 'Yellow': new Set(), 'Red': new Set() };
  for (const s of stones || []) {
    const name = colourName(s, cols);
    const n = Number(s.num ?? 0);
    if (n > 0) (map[name] ??= new Set()).add(n);
  }
  return map;
}

// Smallest available number in 1..MAX_ROCK_NUM for that colour; null if none.
function nextAvailableNumberFor(colour, stones){
  const used = usedNumsByColour(stones)[colour] || new Set();
  for (let n = 1; n <= MAX_ROCK_NUM; n++) if (!used.has(n)) return n;
  return null;
}
    function colourRank(s, cols){
      const name = colourName(s, cols);
      return /^y/i.test(name) ? 0 : 1; // Yellow first, then Red
    }
// Key used to *enforce uniqueness*: one per (colour,num)
function stoneKeyColourNum(s){
  return `${s.colour_index},${Number(s.num ?? 0)}`;
}
// Key used only to check if the underlying set actually changed (includes position)
function posKey(s){
  return `${Math.round(s.origin.x)},${Math.round(s.origin.y)},${s.colour_index},${Number(s.num ?? 0)}`;
}

function dedupeAndSortStones(stones){
  const cols = currentColours();
  // Keep the *last* occurrence of a (colour,num) pair
  const byKey = new Map();
  for (const s of (stones || [])) {
    byKey.set(stoneKeyColourNum(s), s);
  }
  const arr = [...byKey.values()];
  // Sort by number asc; ties Yellow before Red; then position for stability
  arr.sort((a,b) => {
    const na = Number(a.num ?? 0), nb = Number(b.num ?? 0);
    if (na !== nb) return na - nb;
    const ra = /^y/i.test(colourName(a, cols)) ? 0 : 1;
    const rb = /^y/i.test(colourName(b, cols)) ? 0 : 1;
    if (ra !== rb) return ra - rb;
    if (a.origin.x !== b.origin.x) return a.origin.x - b.origin.x;
    return a.origin.y - b.origin.y;
  });
  return arr;
}

function onlyNewStones(parsed, existing){
  const seen = new Set((existing || []).map(stoneKeyColourNum));
  return parsed.filter(s => !seen.has(stoneKeyColourNum(s)));
}

// ---- Positions readout helpers (B = Red, A = Yellow) ----
function fmtFt(n){
  // keep up to 2 decimals, strip .00 / trailing 0
  let s = Number(n).toFixed(2);
  s = s.replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  return s;
}
function buildPositionsReadout(stones){
  const cfg = getConfig();
  const scale = getScale();
  const {cx, cy} = tee();

  // maps: num -> "(x,y)"
  const red = new Map();     // B line
  const yellow = new Map();  // A line
  let maxNum = 0;

  for (const s of stones || []){
    const xft = ( (s.origin.x - cx) / scale );
    const yft = ( (s.origin.y - cy) / scale );
    const tag = `(${fmtFt(xft)},${fmtFt(yft)})`;
    const num = Number(s.num || 0);
    if (num > 0) {
      const name = colourName(s, currentColours()); // "Red" or "Yellow"
      if (/^r/i.test(name)) red.set(num, tag);
      else yellow.set(num, tag);
      if (num > maxNum) maxNum = num;
    }
  }

  // Build arrays with leading (!) where missing; then trim trailing (!)
  const B = []; const A = [];
  for (let i = 1; i <= maxNum; i++){
    B.push( red.get(i) || '(!)' );
    A.push( yellow.get(i) || '(!)' );
  }
  while (B.length && B[B.length-1] === '(!)') B.pop();
  while (A.length && A[A.length-1] === '(!)') A.pop();

  // Compose final string
  return `Positions\nB${B.join('')}\nA${A.join('')}`;
}

// Copy button
function wireCopyPositions(){
  const btn = document.getElementById('copy-positions');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const out = document.getElementById('positions-out');
    const text = out ? out.textContent : '';
    navigator.clipboard.writeText(text).catch(()=>{});
  });
}

    // ---------------------------------------------------

    function updateCount() {
      const cfg   = getConfig();
      const cols  = Array.isArray(cfg.stone_colours) ? cfg.stone_colours : currentColours();
      const scale = getScale();
      const {cx, cy} = tee();

      // combined view (cfg already includes base+manual)
      let stones = Array.isArray(cfg.coordinates) ? cfg.coordinates : [];

      // Dedupe + sort and write back to config if changed
		const cleaned = dedupeAndSortStones(stones);
		const changed = cleaned.length !== stones.length ||
						cleaned.some((s,i) => posKey(s) !== posKey(stones[i]));

      if (changed) {
        cfg.coordinates = cleaned;
        setConfig(cfg);
        stones = cleaned;
      }

      byId('manual-count').textContent = String(manual.length);

      const lines = stones.map((s, i) => {
        const xft = ((s.origin.x - cx) / scale).toFixed(2);
        const yft = ((s.origin.y - cy) / scale).toFixed(2);
        const cname = colourName(s, cols);
        const num = (s.num != null) ? s.num : Math.ceil((i+1)/2);
        return `${cname}, ${xft}, ${yft}, ${num}`;
      });
      byId('stones-ft').value = lines.join('\n');
	  // Update the Positions readout
const posEl = byId('positions-out');
if (posEl) posEl.textContent = buildPositionsReadout(stones);

    }

    // keep textarea in sync if JSON is edited elsewhere
    byId('scenario_config').addEventListener('input', () => { manual = []; updateCount(); });
    window.resetManual = function(){ manual = []; updateCount(); };

    function renderManual(reuseRandom=false) {
      const cfg = getConfig();
      const base = reuseRandom ? (cfg.coordinates || []) : [];
      cfg.coordinates = dedupeAndSortStones(base.concat(manual)); // <— clean here
      setConfig(cfg);
      if (typeof refreshHouse === 'function') { refreshHouse(cfg); }
    }

    // Robust parser
    function parseTextareaToArray(){
      const lines = (byId('stones-ft').value || '')
        .split(/\n+/).map(s => s.trim()).filter(Boolean);

      const cols  = currentColours();
      const scale = getScale();
      const {cx, cy} = tee();
      const out = [];

      for (let i = 0; i < lines.length; i++) {
        const parts = lines[i].split(/[ ,]+/).filter(Boolean);
        if (parts.length < 3) continue;

        const cname = parts[0];
        const xft = parseFloat(parts[1]);
        const yft = parseFloat(parts[2]);
        const num = parts[3] ? parseInt(parts[3], 10) : Math.ceil((i+1)/2);

        const pos = { x: Math.round(cx + xft * scale), y: Math.round(cy + yft * scale) };
        const idx = /^y/i.test(cname) ? cols.indexOf('Yellow') : cols.indexOf('Red');

        out.push({ origin: pos, num, colour_index: (idx >= 0 ? idx : (/^y/i.test(cname) ? 1 : 0)) });
      }
      return out;
    }

    // Apply replaces; Append adds only new stones and then treats the combined set as baseline
    byId('apply-stones').addEventListener('click', () => {
      const parsed = parseTextareaToArray();
      manual = dedupeAndSortStones(parsed).slice();
      renderManual(false);  // replace cfg.coordinates with manual (cleaned)
      updateCount();
    });

    byId('append-stones').addEventListener('click', () => {
      const parsed = parseTextareaToArray();
      const cfg = getConfig();
      const base = (cfg.coordinates || []);
      manual = onlyNewStones(parsed, base); // only unseen
      renderManual(false);                   // base + manual, then cleaned
      // After appending, treat combined set as the current baseline:
      manual = (getConfig().coordinates || []).slice();
      updateCount();
    });

    // NEW: Normalize when the box loses focus (useful for paste/hand edits)
    byId('stones-ft').addEventListener('change', () => {
      const parsed = parseTextareaToArray();
      const cleaned = dedupeAndSortStones(parsed);
      manual = cleaned.slice();
      renderManual(false); // treat as Apply for consistency
      updateCount();
    });

    byId('clear-manual').addEventListener('click', () => { manual = []; renderManual(false); });

    byId('next-red').addEventListener('click', () => {
      nextColour = 'Red';
      byId('next-red').classList.add('active'); byId('next-yellow').classList.remove('active');
    });
    byId('next-yellow').addEventListener('click', () => {
      nextColour = 'Yellow';
      byId('next-yellow').classList.add('active'); byId('next-red').classList.remove('active');
    });
    byId('next-red').classList.add('active');

    byId('undo').addEventListener('click', () => {
      manual.pop(); renderManual(false); updateCount();
    });

    byId('enable-click').addEventListener('click', () => {
      placeEnabled = !placeEnabled;
      byId('enable-click').classList.toggle('active', placeEnabled);
      overlay.style.cursor = placeEnabled ? 'crosshair' : 'default';
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') {
        nextColour = (nextColour === 'Red' ? 'Yellow' : 'Red');
        byId('next-red').classList.toggle('active', nextColour === 'Red');
        byId('next-yellow').classList.toggle('active', nextColour === 'Yellow');
      } else if (e.key === 'z' || e.key === 'Z') {
        manual.pop(); renderManual(false); updateCount();
      } else if (e.key === 'Escape') {
        placeEnabled = false; byId('enable-click').classList.remove('active'); overlay.style.cursor = 'default';
      }
    });

    // === Click-to-place on overlay ===
overlay.addEventListener('click', (evt) => {
  if (!placeEnabled) return;

  const rect = overlay.getBoundingClientRect();
  let x = Math.round(evt.clientX - rect.left);
  let y = Math.round(evt.clientY - rect.top);
  const r = stoneRadius();
  x = clamp(x, r, overlay.width - r);
  y = clamp(y, r, overlay.height - r);

  const cfg = getConfig();
  const cols = currentColours();
  const colour = nextColour; // "Yellow" or "Red"

  // Pick the smallest available number for this colour (1..8)
  const nextNum = nextAvailableNumberFor(colour, cfg.coordinates || []);
  if (nextNum === null) {
    // All 1..8 taken for this colour — don't place and inform the user
    console.warn(`${colour} 1–${MAX_ROCK_NUM} already used; cannot add another.`);
    // Optional: replace with your own toast/notice UI
    alert(`${colour} 1–${MAX_ROCK_NUM} already used.`);
    return;
  }

  const idx = (colour === 'Yellow') ? cols.indexOf('Yellow') : cols.indexOf('Red');
  const stone = {
    origin: { x, y },
    num: nextNum,
    colour_index: (idx >= 0 ? idx : (colour === 'Yellow' ? 1 : 0)),
  };

  // Add, clean, and render
  manual.push(stone);
  renderManual(true);   // combines with base then de-dupes/sorts
  updateCount();        // shows clean, ordered list
});


    // === Drag-to-move & Right-click delete ===
    let draggingIndex = -1;
    let dragOffset = {x:0,y:0};

    overlay.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const rect = overlay.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const cfg = getConfig();
      const radius = stoneRadius();
      let hit = -1, best = Infinity;
      (cfg.coordinates || []).forEach((s, i) => {
        const d = dist(x,y,s.origin.x,s.origin.y);
        if (d < radius && d < best) { best = d; hit = i; }
      });
      if (hit >= 0) {
        draggingIndex = hit;
        dragOffset.x = x - cfg.coordinates[hit].origin.x;
        dragOffset.y = y - cfg.coordinates[hit].origin.y;
        overlay.style.cursor = 'grabbing';
      }
    });

    overlay.addEventListener('mousemove', (e) => {
      if (draggingIndex < 0) return;
      const rect = overlay.getBoundingClientRect();
      let x = Math.round(e.clientX - rect.left - dragOffset.x);
      let y = Math.round(e.clientY - rect.top - dragOffset.y);
      const r = stoneRadius();
      x = clamp(x, r, overlay.width - r);
      y = clamp(y, r, overlay.height - r);
      const cfg = getConfig();
      if (cfg.coordinates && cfg.coordinates[draggingIndex]) {
        cfg.coordinates[draggingIndex].origin.x = x;
        cfg.coordinates[draggingIndex].origin.y = y;
        cfg.coordinates = dedupeAndSortStones(cfg.coordinates); // keep tidy while dragging too
        setConfig(cfg);
        if (typeof refreshHouse === 'function') { refreshHouse(cfg); }
      }
    });

    window.addEventListener('mouseup', () => {
      if (draggingIndex >= 0) {
        draggingIndex = -1;
        overlay.style.cursor = placeEnabled ? 'crosshair' : 'default';
        const cfg = getConfig();
        cfg.coordinates = dedupeAndSortStones(cfg.coordinates || []);
        setConfig(cfg);
        manual = (cfg.coordinates || []).slice();
        updateCount();
      }
    });

    overlay.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const rect = overlay.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const cfg = getConfig();
      const radius = stoneRadius();
      let hit = -1, best = Infinity;
      (cfg.coordinates || []).forEach((s, i) => {
        const d = dist(x,y,s.origin.x,s.origin.y);
        if (d < radius && d < best) { best = d; hit = i; }
      });
      if (hit >= 0) {
        cfg.coordinates.splice(hit, 1);
        cfg.coordinates = dedupeAndSortStones(cfg.coordinates);
        setConfig(cfg);
        manual = (cfg.coordinates || []).slice();
        updateCount();
        if (typeof refreshHouse === 'function') { refreshHouse(cfg); }
      }
      return false;
    });

    // === Import / Export JSON ===
    byId('export-json').addEventListener('click', () => {
      const text = byId('scenario_config').value;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
      a.download = 'scenario.json';
      a.click();
    });
    byId('import-json').addEventListener('click', () => byId('import-file').click());
    byId('import-file').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const cfg = JSON.parse(text);
        cfg.coordinates = dedupeAndSortStones(cfg.coordinates || []);
        setConfig(cfg);
        manual = (cfg.coordinates || []).slice();
        updateCount();
        if (typeof refreshHouse === 'function') { refreshHouse(cfg); }
      } catch { alert('Invalid JSON'); }
      e.target.value = '';
    });

    window.addEventListener('load', () => {
      try {
        const cfg = getConfig();
        if (Array.isArray(cfg.coordinates) && cfg.coordinates.length) {
          cfg.coordinates = dedupeAndSortStones(cfg.coordinates);
          setConfig(cfg);
          manual = cfg.coordinates.slice();
          updateCount();
        } else {
          updateCount();
        }
      } catch {}
      if (typeof mirrorScenarioToEditor === 'function') mirrorScenarioToEditor();
	  wireCopyPositions();
const cfgAfterLoad = getConfig();
const stonesAfterLoad = Array.isArray(cfgAfterLoad.coordinates) ? cfgAfterLoad.coordinates : [];
const posEl = document.getElementById('positions-out');
if (posEl) posEl.textContent = buildPositionsReadout(stonesAfterLoad);

    });
  })();
</script>
</body>
</html>
