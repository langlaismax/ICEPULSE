  <style>
    :root{
      --pro-bg:#f7f9fc;
      --pro-card:#ffffff;
      --pro-text:#111318;
      --pro-muted:#5f6672;
      --pro-border:#e7ecf3;
      --pro-accent:#0f6fff;
      --pro-accent-2:#58b6ff;
      --pro-radius:12px;
      --pro-shadow:0 10px 30px rgba(14,30,65,.08);
    }
    html,body{background:var(--pro-bg);color:var(--pro-text);margin:0;padding:18px;font-family:Inter,system-ui,Arial}
    .wrap{max-width:1180px;margin:0 auto}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--pro-accent),var(--pro-accent-2));color:#fff;padding:8px 12px;border-radius:10px}
    .logo h1{margin:0;font-size:1rem}
    .muted{color:var(--pro-muted)}
    .card{background:var(--pro-card);border:1px solid var(--pro-border);border-radius:var(--pro-radius);box-shadow:var(--pro-shadow);padding:14px;margin-bottom:12px}
    select{background:#fff;color:var(--pro-text);border:1px solid var(--pro-border);border-radius:10px;padding:10px 12px;font-size:16px;min-width:220px}
    .nav-row{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
    .nav-row a{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:10px;border:1px solid var(--pro-border);text-decoration:none;color:#111;background:#fff;font-weight:600}
    .nav-row a.active{background:linear-gradient(180deg,var(--pro-accent),var(--pro-accent-2));color:#fff;border:none;box-shadow:0 8px 20px rgba(15,111,255,.18)}
    .iframe-rail{border:1px solid var(--pro-border);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--pro-shadow)}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    @media (max-width:600px){html,body{padding:12px}}
  </style>

</head>
<body>

    <section class="card">

        <div class="row">
          <label for="folderSelect" class="muted">Choose folder</label>
          <select id="folderSelect" aria-label="Choose Google Drive folder">
   
  <option value="1YGtZqXNvue9gkm3cFJiQrxmcIzPXDeEp">Install Info</option>         
  <option value="151uJHuRFW1c5K2r3pDvGYfV4cNQIbeyz">CCA Material</option>
  <option value="1TbvFjAVRoPko8Zg7Fbq2LepBSPzGDWYq">Equipment Photos</option>

          </select>

    </section>

    <section class="card">
      <div class="iframe-rail">
        <iframe id="galleryFrame" src="" style="width:100%; height:78vh; border:0" title="Gallery"></iframe>
      </div>
    </section>
  </div>
  
  <script>
    function folderIdToEmbedUrl(id){
      return "https://drive.google.com/embeddedfolderview?id=" + encodeURIComponent(id) + "#grid";
    }
    function initGallery(selectId, frameId){
      const select = document.getElementById(selectId);
      const frame  = document.getElementById(frameId);
      function apply(){
        const id = select.value;
        frame.src = folderIdToEmbedUrl(id);
        const params = new URLSearchParams(location.search);
        params.set('id', id);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
      }
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if(id){
        for(const opt of select.options){ if(opt.value === id){ select.value = id; break; } }
      }
      apply();
      select.addEventListener('change', apply);
    }
  </script>

  <script>initGallery('folderSelect','galleryFrame');</script>
