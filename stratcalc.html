<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Strategy Calc</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#fff; --muted:#6b7280; --text:#111827;
    --accent:#0f6fff; --accent-2:#1fb6ff; --card-pad:14px; --radius:10px;
  }
  body{margin:18px; font-family:Inter,system-ui,Arial; background:linear-gradient(180deg,var(--bg),#f2f4f6); color:var(--text)}
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .logo{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;padding:8px 12px;border-radius:10px}
  .logo h1{margin:0;font-size:1rem}
  .muted{color:var(--muted)}
  .card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06);border:1px solid rgba(15,23,42,0.04)}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
  .control{display:flex;flex-direction:column}
  label{font-size:0.78rem;color:var(--muted);margin-bottom:6px}
  select,input,button{padding:8px;border-radius:8px;border:1px solid #e6e8eb;background:#fff;font-size:0.95rem}
  select[multiple]{min-height:82px}
  .w-110{width:110px}.w-160{width:160px}.w-180{width:180px}.w-200{width:200px}.w-240{width:240px}
  .btn{padding:8px 12px;border-radius:8px;border:1px solid #e6e8eb;background:#fff;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff;border:none;box-shadow:0 6px 20px rgba(15,111,255,0.12)}
  #constraints{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  @media(max-width:1000px){#constraints{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:700px){#constraints{grid-template-columns:repeat(2,1fr)}}
  .task-card{padding:10px;border-radius:8px;border:1px solid #f0f2f4;background:linear-gradient(180deg,#fff,#fbfdff)}
  .task-title{font-weight:700;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:0.92rem}
  thead th{background:linear-gradient(180deg,#f8fafc,#fff);position:sticky;top:0;padding:10px;text-align:left;color:var(--muted)}
  td,th{padding:8px 10px;border-bottom:1px solid #f0f2f4}
  .center{text-align:center}
  .swatch{width:160px;height:14px;border-radius:6px;background:linear-gradient(90deg,hsl(0,78%,45%),hsl(60,78%,45%),hsl(120,78%,45%))}
  .progress-wrap{height:14px;background:#eef2f7;border-radius:10px;margin-top:10px;overflow:hidden;border:1px solid #eef3fb;display:none}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;color:white;font-size:11px;display:flex;align-items:center;justify-content:center}
  /* new highlight cell styles */
  .cell-best-est{background:linear-gradient(90deg,#ffe5b4,#ffcf6b);color:#111;font-weight:700;border-radius:6px}
  .cell-best-player{background:linear-gradient(90deg,#bff3d0,#50d88a);color:#022;font-weight:700;border-radius:6px}
  .muted-xs{color:var(--muted);font-size:0.86rem}
  /* Horizontal scroll rails that keep wide content inside cards */
.h-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border: 1px solid #eef2f7;
  border-radius: 10px;
}

/* Give the inner wide content breathing room so borders aren't flush */
.h-scroll > * {
  min-width: 720px;           /* ensures a useful scroll target on small screens */
}


/* Make sure cards contain their children and don't "leak" shadows/content */
.card { overflow: hidden; }

/* Let the shot grid scroll inside a rail on narrow screens */
@media (max-width: 900px) {
  #constraintsContainer { overflow-x: auto; }
  #constraints { min-width: 720px; } /* so it scrolls horizontally instead of breaking the card */
}

/* Controls: keep widths reasonable on small screens */
@media (max-width: 600px) {
  .w-110, .w-160, .w-180, .w-200, .w-240 {
    width: clamp(140px, 44vw, 240px);
  }
  .wrap { margin: 12px; }
  body { margin: 12px; }
}

/* Results table: make sure it can be wider without breaking layout */
#results table { width: max(100%, 720px); }

</style>

<style id="pro-light-skin">

/* === Pro Light Skin (non-destructive) === */
:root{
  --pro-bg:#f7f9fc;
  --pro-surface:#ffffff;
  --pro-surface-2:#fbfdff;
  --pro-card:#ffffff;
  --pro-text:#111318;
  --pro-muted:#5f6672;
  --pro-border:#e7ecf3;
  --pro-accent:#0f6fff;
  --pro-accent-2:#58b6ff;
  --pro-radius:12px;
  --pro-shadow:0 10px 30px rgba(14,30,65,.08);
}
html,body{background:var(--pro-bg) !important;color:var(--pro-text)}
/* Cards */
.card, .panel, section.card, .box{
  background: var(--pro-card) !important;
  border: 1px solid var(--pro-border) !important;
  border-radius: var(--pro-radius) !important;
  box-shadow: var(--pro-shadow) !important;
}
/* Inputs */
input,select,textarea{
  background:#fff !important;
  color:var(--pro-text) !important;
  border:1px solid var(--pro-border) !important;
  border-radius:10px !important;
  padding:10px 12px !important;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--pro-accent)!important;box-shadow:0 0 0 3px rgba(15,111,255,.18)!important;outline:0}
/* Buttons */
button,.btn,.button{
  border-radius:10px !important;
  border:1px solid var(--pro-border) !important;
  background: linear-gradient(180deg, var(--pro-accent), var(--pro-accent-2)) !important;
  color:#fff !important;
  font-weight:600 !important;
  box-shadow:0 8px 20px rgba(15,111,255,.18) !important;
  transition:transform .05s ease;
}
button:active,.btn:active{transform:translateY(1px)}
/* Secondary/alt buttons keep light look */
.alt,.btn.secondary,.ghost,.outline{background:#fff !important;color:var(--pro-text)!important;box-shadow:none!important}
/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid var(--pro-border);padding:10px 12px;white-space:nowrap;text-align:left}
thead th{position:sticky;top:0;background:var(--pro-surface);color:var(--pro-muted);font-weight:600;font-size:12px;text-transform:uppercase}
tbody tr:nth-child(odd) td{background:#fafbfe}
/* Scroll rails for wide content */
.table-wrap-auto{border:1px solid var(--pro-border);border-radius:10px;overflow:auto;background:#fff;box-shadow:var(--pro-shadow)}
/* Mobile density */
@media(max-width:600px){ th,td{padding:8px 10px;font-size:13px} }
.nav-row{display:flex;gap:8px;margin-left:auto}
.nav-row a{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 12px;border-radius:10px;border:1px solid var(--pro-border);
  text-decoration:none;color:#111;background:#fff;font-weight:600;
}
.nav-row a.active{
  background:linear-gradient(180deg,var(--pro-accent),var(--pro-accent-2));
  color:#fff;border:none;box-shadow:0 8px 20px rgba(15,111,255,.18)
}
</style>

<div class="muted-xs">Load to input custom stats.</div>

let mergedAll = [], byYearMap = {}, playerStatsObj = null;

// helper: normalize a string for comparisons: lowercase, remove punctuation, collapse whitespace
function normalizeStr(s){
  if(!s) return '';
  return String(s).toLowerCase().replace(/[^\w\s]/g,' ').replace(/\s+/g,' ').trim();
}

// robust gender matching so "Men" does NOT match "Women"
function genderMatches(recGender, selGender){
  if(!selGender || selGender === 'Any') return true;
  if(!recGender) return false;

  const rg = String(recGender).toLowerCase();
  const sg = String(selGender).toLowerCase();

  // normalized token checks
  if(sg === 'men' || sg === "men's" || sg === "mens"){
    // match 'men' as a whole word but reject if 'women' is present
    return (/\bmen\b/.test(rg) || /\bmen's\b/.test(rg)) && !/\bwomen\b/.test(rg);
  }

  if(sg === 'women' || sg === "women's" || sg === "womens"){
    return /\bwomen\b/.test(rg) || /\bwomen's\b/.test(rg) || /\bwomens\b/.test(rg);
  }

  // Mixed doubles explicit
  if(sg.includes('mixed') && sg.includes('doubles') || sg.includes('mixed-doubles') ){
    return /\bmixed\b/.test(rg) && /\bdoubl/i.test(rg);
  }

  // generic mixed
  if(sg.includes('mixed')){
    return /\bmixed\b/.test(rg);
  }

  // fallback: match whole word token equality
  return rg.split(/\W+/).includes(sg);
}

/* DOM refs */
const evalPos = document.getElementById('evalPos');

/* init UI */
for(let i=1;i<=16;i++) evalPos.appendChild(new Option(i,i));

for(let v=10; v>=0; v--) endsLeftSelect.appendChild(new Option(String(v), String(v)));

for(let i=-6;i<=6;i++){ hammerStartSelect.appendChild(new Option(String(i), String(i))); }

/* build shot cards */
for(let i=0;i<16;i++){

// ===== shot selection collapse/expand behavior =====

// The #constraints element itself is used by existing code to append the cards.
const constraintsContainer = document.getElementById('constraintsContainer');
const toggleConstraintsBtn = document.getElementById('toggleConstraintsBtn');

// sanity check (in case markup not present)
if(toggleConstraintsBtn && constraintsContainer){
  // default folded (already set via HTML), but set button text to match

      constraintsContainer.style.display = 'block';

    } else {

      toggleConstraintsBtn.classList.remove('btn-primary');

  }

  // default state: folded

  setConstraintsState(constraintsExpanded);

  toggleConstraintsBtn.addEventListener('click', (e)=>{

    setConstraintsState(constraintsExpanded);

}

document.querySelectorAll('.turnSel').forEach(s=> { TURN_OPTIONS.forEach(t=> s.add(new Option(t,t))); s.value='Any'; });

/* defaults grid (REPLACE existing defaults grid block with this) */
const DEFAULT_TASKS = TASK_OPTIONS.filter(t=>t!=='Any');

// create expanded defaultsGrid (per-task inputs) as before
DEFAULT_TASKS.forEach(task=>{
  const div = document.createElement('div');

// --- CONDENSED CONTROLS (updated: two bins, no turns) ---
// Bins:
// Draws: ["Draw","Guard","Front","Freeze"]

// helper maps for bins (unchanged)
const BIN_DRAW = ['Draw','Guard','Front','Freeze'];
const BIN_TAKE = ['Take-out','Hit-roll','Double','Raise','Clearing','Through','Wick','Promotion'];

// utility: get all defInput elements
function getAllDefInputs(){
  return Array.from(document.querySelectorAll('.defInput'))
    .map(inp => ({ el: inp, task: inp.dataset.task, turn: inp.dataset.turn }));
}

// compute bin average across BOTH turns from per-shot inputs or playerStatsObj
function computeBinAveragesForPlayerBothTurns(playerName){
  const out = { draw:null, take:null };
  const mean = arr => {
    const nums = arr.filter(n=>n!=null && !isNaN(n)).map(Number);
    return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null;
  };

  const p = (playerName && playerStatsObj && playerStatsObj[playerName]) ? playerStatsObj[playerName] : null;

  let drawVals = [], takeVals = [];

  if (p && p.tasks){
    BIN_DRAW.forEach(t => {
      const e = p.tasks[t]; if(!e) return;
      if(e.CW!=null) drawVals.push(e.CW);
      if(e.CCW!=null) drawVals.push(e.CCW);
    });
    BIN_TAKE.forEach(t => {
      const e = p.tasks[t]; if(!e) return;
      if(e.CW!=null) takeVals.push(e.CW);
      if(e.CCW!=null) takeVals.push(e.CCW);
    });
  }

  // fallback to current UI values if playerStatsObj is missing or sparse
  if(drawVals.length===0 || takeVals.length===0){
    const inputs = getAllDefInputs();
    inputs.forEach(i=>{
      const val = i.el.value==='' ? null : Number(i.el.value);
      if(BIN_DRAW.includes(i.task)) drawVals.push(val);
      if(BIN_TAKE.includes(i.task)) takeVals.push(val);
    });
  }

  out.draw = mean(drawVals);
  out.take = mean(takeVals);
  return out;
}

/* CSV parsing (for players) */
function splitCSVLine(line){ const out=[]; let cur=''; let inQ=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; } else { if(ch===','){ out.push(cur); cur=''; } else if(ch==='"'){ inQ=true; } else cur+=ch; } } out.push(cur); return out; }
function parseCSV(text){ const lines=text.split(/\r?\n/).filter(l=>l.trim()!==''); if(lines.length===0) return {header:[],rows:[]}; const header = splitCSVLine(lines[0]).map(h=>h.trim()); const rows=[]; for(let i=1;i<lines.length;i++){ const cols=splitCSVLine(lines[i]); if(cols.length===0) continue; const obj={}; for(let j=0;j<header.length;j++) obj[header[j]] = cols[j]===undefined? '' : cols[j]; rows.push(obj);} return {header, rows}; }
function parsePercent(s){ if(s===null||s===undefined) return null; let t=String(s).trim(); if(!t || t.toUpperCase()==='N/A') return null; t=t.replace('%','').replace(/,/g,'').trim(); const n=Number(t); return isNaN(n)? null : n; }

/* ======== loadPlayersCSV (UPDATED to show count) ======== */
async function loadPlayersCSV(path='/data/players_stats_spreadsheet_extended.csv'){
  try{
    const r = await fetch(path); if(!r.ok) throw new Error('not found'); const txt = await r.text();
    const parsed = parseCSV(txt); const headers = parsed.header; const rows = parsed.rows;
    const taskCols = {};
    headers.forEach(h=>{ const m = h.match(/^(.*)_(CW|CCW)$/i); if(m){ const t=m[1].trim(); const turn=m[2].toUpperCase(); taskCols[t] = taskCols[t] || {taskName:t, CW:null, CCW:null}; taskCols[t][turn] = h; } });
    playerStatsObj = {};

      const entry = { Shots: row['Shots']||'', AVG_CW: parsePercent(row['AVG_CW']||''), AVG_CCW: parsePercent(row['AVG_CCW']||''), tasks:{} };
      Object.values(taskCols).forEach(tc=>{ const cw = tc.CW ? parsePercent(row[tc.CW]) : null; const ccw = tc.CCW ? parsePercent(row[tc.CCW]) : null; entry.tasks[tc.taskName] = {CW:cw, CCW:ccw}; });

/* constraints reading & matching (multi-select aware) */
function readConstraints(){ const tasks = document.querySelectorAll('.taskSel'); const turns = document.querySelectorAll('.turnSel'); const out=[]; for(let i=0;i<16;i++){ const taskVals = getSelectedValues(tasks[i]); const turnVals = getSelectedValues(turns[i]); out.push({task:taskVals, turn:turnVals}); } return out; }
function matchesConstraint(endRec, cons){
  for(let i=0;i<cons.length;i++){
    const c=cons[i]; const isTaskAny = c.task.includes('Any'); const isTurnAny = c.turn.includes('Any');
    if(isTaskAny && isTurnAny) continue;
    const shot = (endRec.shots||[]).find(s=>Number(s.shot_num)===i+1); if(!shot) return false;
    const shotTask = (shot.task||'').toString(); const shotTurn = (shot.turn||'').toString().toUpperCase();
    if(!isTaskAny){
      let matched=false;
      for(const opt of c.task){
        if(opt==='Any'){ matched=true; break; }
        if(opt.toLowerCase()==='guard'){ if(/guard/i.test(shotTask)){ matched=true; break; } }
        else if(opt.toLowerCase()==='front'){ if(/^front$/i.test(shotTask)){ matched=true; break; } }
        else { if(shotTask && shotTask.toLowerCase()===opt.toLowerCase()){ matched=true; break; } }
      }
      if(!matched) return false;
    }
    if(!isTurnAny){
      const selTurns = c.turn.map(x=>x.toUpperCase());
      if(!selTurns.includes(shotTurn)) return false;
    }
  }
  return true;
}

/* analysis core (with category alias normalization) */
async function analyze(){
  const dataset = mergedAll;
  const cons = readConstraints();
  const evalShot = Number(evalPos.value || 1);
  const sd = startDateEl.value? new Date(startDateEl.value) : null;
  const ed = endDateEl.value? new Date(endDateEl.value) : null;
  const minSupport = Number(supportSlider.value);
  const endsSelected = getSelectedValues(endsLeftSelect); const endsIsAny = endsSelected.includes('Any');
  const genderSelected = getSelectedValues(genderSelect); const genderIsAny = genderSelected.includes('Any');

  /* --- inside analyze(): read selected categories (multi) --- */
  const categorySelected = getSelectedValues(categorySelect);
  const categoryIsAny = categorySelected.includes('Any') || categorySelected.length === 0;

  // read new filters
  const timeSelected = (timeSelect && timeSelect.value) ? timeSelect.value : 'all';
  const hammerSelected = (hammerStartSelect && hammerStartSelect.value) ? hammerStartSelect.value : 'all';

  const tournamentSelected = (tournamentSelect && tournamentSelect.value) ? tournamentSelect.value : 'all';

  // build normalized alias list for selected categories (only once)
let selectedCategoryAliases = null;
  let selectedCategoryExact = null;
  if (!categoryIsAny) {
    selectedCategoryAliases = [];
    selectedCategoryExact = new Set();

    for (const selRaw of categorySelected) {
      if (!selRaw || selRaw === 'Any') continue;
      const sel = String(selRaw).trim();
      // exact label (lowercase) for direct equality checks later
      selectedCategoryExact.add(sel.toLowerCase());

      // normalized whole selection (e.g. "Grand Slams" -> "grand slams")
      const wholeNorm = normalizeStr(sel);
      if (wholeNorm && !selectedCategoryAliases.includes(wholeNorm)) selectedCategoryAliases.push(wholeNorm);

      // also add individual words/tokens from the selection (e.g. "Grand" "Slams")
      sel.split(/\W+/).forEach(tok => {
        const tnorm = normalizeStr(tok);
        if (tnorm && !selectedCategoryAliases.includes(tnorm)) selectedCategoryAliases.push(tnorm);
      });

      // add any mapped aliases from CATEGORY_ALIASES (and their tokens)
      const mapped = CATEGORY_ALIASES[sel] || CATEGORY_ALIASES[sel.trim()] || null;
      if (mapped && Array.isArray(mapped)) {
        mapped.forEach(m => {
          const mn = normalizeStr(m);
          if (mn && !selectedCategoryAliases.includes(mn)) selectedCategoryAliases.push(mn);
          m.split(/\W+/).forEach(tok => {
            const t2 = normalizeStr(tok);
            if (t2 && !selectedCategoryAliases.includes(t2)) selectedCategoryAliases.push(t2);
          });
        });
      }
    }
  }

  const candidateTasks = TASK_OPTIONS.filter(t=>t!=='Any');
  const pairs=[]; candidateTasks.forEach(t=>['CW','CCW'].forEach(turn=> pairs.push({task:t, turn:turn})));
  // accum now tracks totals, counts per bucket and wins per bucket
  const accum = {}; pairs.forEach(p=> accum[`${p.task}||${p.turn}`] = { total:0, counts: BUCKETS.map(()=>0), wins: BUCKETS.map(()=>0), totalWins:0 });

  let matchedEnds = 0;
  for(const endRec of dataset){
    if(sd || ed){ if(endRec.date){ const d=new Date(endRec.date); if(sd && d<sd) continue; if(ed && d>ed) continue; } }

    // time filter
    if(timeSelected && timeSelected !== 'all'){
      const recTime = (endRec.time || '').toString().toLowerCase();
      if(recTime !== timeSelected) continue;
    }

    // hammer_team_start_score filter
    if(hammerSelected && hammerSelected !== 'all'){
      const val = endRec.hammer_team_start_score;
      const num = (val === null || val === undefined || val === '') ? null : Number(val);
      if(num === null || isNaN(num) || num !== Number(hammerSelected)) continue;
    }

    

    // tournament filter
    if(tournamentSelected && tournamentSelected !== 'all'){
      const t = (endRec.tournament == null) ? '' : String(endRec.tournament);
      if(t !== tournamentSelected) continue;
    }
// ends filter
    if(!endsIsAny){ if(endRec.ends_remaining==null) continue; const er = Number(endRec.ends_remaining); if(!endsSelected.map(x=>Number(x)).includes(er)) continue; }

    // gender filter
    // gender filter (improved: exact/word-boundary matching so "Men" won't match "Women")
	if(!genderIsAny){
	const recGender = (endRec.gender || '').toString();
	const ok = genderSelected.some(g => genderMatches(recGender, g));
	if(!ok) continue;
	}


    // category filter: use normalized aliases for robust matching
    if(!categoryIsAny){
      const recCatRaw = (endRec.category || '');
      const recCat = normalizeStr(recCatRaw);
      if(!recCat) continue;
      const okc = selectedCategoryAliases.some(alias => recCat.indexOf(alias) !== -1);
      if(!okc) continue;
    }

    if(!matchesConstraint(endRec, cons)) continue;

    matchedEnds++;
    const shot = (endRec.shots||[]).find(s=>Number(s.shot_num)===evalShot); if(!shot) continue;
    const shotTask = (shot.task||'').toString(); const shotTurn = (shot.turn||'').toString().toUpperCase();
    const signed = (endRec.signed_score == null) ? null : Number(endRec.signed_score);
    if(signed==null) continue;

    for(const p of pairs){
      let matchTask=false;
      if(p.task.toLowerCase()==='guard') matchTask = /guard/i.test(shotTask);
      else if(p.task.toLowerCase()==='front') matchTask = /^front$/i.test(shotTask);
      else matchTask = shotTask && shotTask.toLowerCase() === p.task.toLowerCase();
      if(!matchTask) continue;
      if(shotTurn !== p.turn) continue;
      const key = `${p.task}||${p.turn}`; const b = scoreBucket(signed); if(!b) continue;
      const idx = BUCKETS.indexOf(b); if(idx>=0){
        accum[key].counts[idx] += 1; accum[key].total += 1;
        // win calculation: if endRec.winner equals the team who played the shot
        try{
          const winner = (endRec.winner || '').toString().trim();
          const shotTeam = (shot.team || '').toString().trim();
          if(winner && shotTeam && normalizeStr(winner) === normalizeStr(shotTeam)){
            accum[key].wins[idx] += 1; accum[key].totalWins += 1;
          }
        }catch(e){}
      }
    }
  }

  // build rows (condensed combines turns)
  const rowsPre = [];
  if(condensed){
    for(const task of TASK_OPTIONS.filter(t=>t!=='Any')){
      const aCW = accum[`${task}||CW`] || {total:0, counts: BUCKETS.map(()=>0), wins: BUCKETS.map(()=>0), totalWins:0};
      const aCCW = accum[`${task}||CCW`] || {total:0, counts: BUCKETS.map(()=>0), wins: BUCKETS.map(()=>0), totalWins:0};

    const teams = formatTeams(teamsRaw);
    if(teams && teams.length){
      const h = document.createElement('div'); h.style.fontWeight='700'; h.style.marginTop='10px'; h.textContent = 'Teams';
      extendedInfoDiv.appendChild(h);
      const ul = document.createElement('div');
      ul.style.marginTop = '6px';
      ul.style.lineHeight = '1.3';
      teams.forEach(t => {
        const d = document.createElement('div');
        d.textContent = '• ' + t;
        ul.appendChild(d);
      });
      extendedInfoDiv.appendChild(ul);
    }

    // PP metrics
    if(row){
      const ppTeam = row['PP_team_throws16_hammer'] || row['pp_team_throws16_hammer'] || row['PP_team'] || '';
      const ppOpp = row['PP_opp_throws16_hammer'] || row['pp_opp_throws16_hammer'] || row['PP_opp'] || '';
      if(ppTeam || ppOpp){
        const h = document.createElement('div'); h.style.fontWeight='700'; h.style.marginTop='10px'; h.textContent = 'Estimated points-per-end';
        extendedInfoDiv.appendChild(h);
        const tbl = document.createElement('div');
        tbl.style.display = 'grid';
        tbl.style.gridTemplateColumns = '1fr 1fr';
        tbl.style.gap = '6px';
        tbl.style.marginTop = '6px';
        const addRow = (label, value) => {
          const a = document.createElement('div'); a.style.color = '#444'; a.textContent = label;
          const b = document.createElement('div'); b.style.textAlign = 'right'; b.style.color = '#000'; b.textContent = (value==null || value==='') ? 'N/A' : String(value);
          tbl.appendChild(a); tbl.appendChild(b);
        };
        addRow('Hammer:', ppTeam);
        addRow('Non-Hammer:', ppOpp);
        extendedInfoDiv.appendChild(tbl);
      }
    }

    // small tip/footer
    const tip = document.createElement('div');
    tip.style.marginTop = '00px';
    tip.style.fontSize = '0.0rem';
    tip.style.color = '#666';
    extendedInfoDiv.appendChild(tip);
  }

  // hookup events
  const playerSelectEl = document.getElementById('playerSelect');
  const reloadBtn = document.getElementById('reloadExtendedBtn_csvonly');
  const pathInput = document.getElementById('extendedCsvPath_csvonly');

  if(playerSelectEl){
    playerSelectEl.addEventListener('change', ()=> {
      showExtendedForPlayer(playerSelectEl.value);
    });
  }

  if(reloadBtn){
    reloadBtn.addEventListener('click', async ()=>{
      const p = (pathInput && pathInput.value) ? pathInput.value.trim() : DEFAULT_CSV;
      extendedInfoDiv.textContent = 'Loading player CSV...';
      await loadPlayerExtendedCSV(p);
      // re-render selected
      const sel = playerSelectEl ? playerSelectEl.value : null;
      if(sel) showExtendedForPlayer(sel);
    });
  }

  // auto-load on startup
  (async function autoLoad(){
    await loadPlayerExtendedCSV(DEFAULT_CSV);
    const initial = playerSelectEl ? playerSelectEl.value : null;
    if(initial) showExtendedForPlayer(initial);
  })();

})();


// === Minimal auto-update on filter change ===
document.addEventListener('DOMContentLoaded', function(){
  const ids = [
    'playerSelect','evalPos','startDate','endDate','timeSelect','supportSlider',
    'endsLeftSelect','hammerStartSelect','genderSelect','categorySelect','tournamentSelect'
  ];
  const run = ()=>{ try{ if (typeof analyze==='function') analyze(); }catch(e){} };
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const evt = (id==='supportSlider') ? 'input' : 'change';
    el.addEventListener(evt, run, { passive: true });
  });
});

</script>

<script id="pro-light-skin-js">
(function(){
  // If there's a speed/log/results table that can overflow, wrap it in a rail.
  var candidates = document.querySelectorAll('table');
  candidates.forEach(function(t){
    if(t.parentElement && !t.parentElement.classList.contains('table-wrap-auto')){
      // Wrap only if the table is likely to overflow on mobile (min columns heuristic)
      var cols = t.tHead && t.tHead.rows[0] ? t.tHead.rows[0].cells.length : t.rows[0] ? t.rows[0].cells.length : 0;
      if(cols >= 3){
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap-auto';
        t.parentElement.insertBefore(wrap, t);
        wrap.appendChild(t);
      }
    }
  });
})();
</script>
