  <script>
    function folderIdToEmbedUrl(id){
      return "https://drive.google.com/embeddedfolderview?id=" + encodeURIComponent(id) + "#grid";
    }
    function initGallery(selectId, frameId){
      const select = document.getElementById(selectId);
      const frame  = document.getElementById(frameId);
      function apply(){
        const id = select.value;
        frame.src = folderIdToEmbedUrl(id);
        const params = new URLSearchParams(location.search);
        params.set('id', id);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
      }
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if(id){
        for(const opt of select.options){ if(opt.value === id){ select.value = id; break; } }
      }
      apply();
      select.addEventListener('change', apply);
    }
  </script>
