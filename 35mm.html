<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Film Gallery</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg: #020617;
      --bg-soft: #020617;
      --card-bg: #020617;
      --card-border: rgba(148, 163, 184, 0.5);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: radial-gradient(circle at top, #020617 0, #020617 35%, #020617 100%);
    }

    header.app-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
    }

    .app-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .app-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .app-right {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0; /* important for flex + overflow */
    }

    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .hidden {
      display: none !important;
    }

    /* Landing grid */

    .landing {
      padding: 16px;
      flex: 1;
      min-height: 0;
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      width: 100%;
      height: calc(100vh - 70px); /* header approx */
      overflow-y: auto;
      padding-bottom: 16px;
    }

    .film-card {
      position: relative;
      border-radius: 18px;
      background: radial-gradient(circle at 20% 0%, #0f172a 0, #020617 55%);
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.65);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .film-card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--accent);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.85);
      background: radial-gradient(circle at 0 0, #0b1120 0, #020617 60%);
    }

    .film-logo-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .film-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.8));
    }

    .film-logo-fallback {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      background: radial-gradient(circle at 30% 0%, rgba(56,189,248,0.3), transparent 60%);
    }

    .film-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.3;
    }

    .film-meta {
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Gallery */

    .gallery-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .back-btn {
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(15, 23, 42, 1);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .back-btn span.chevron {
      font-size: 0.8rem;
    }

    .gallery-title {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .gallery-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .gallery-shell {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #000;
    }

    .gallery-scroll {
      position: absolute;
      inset: 0;
      display: flex;
      min-height: 0;
      min-width: 0;
      scroll-behavior: smooth;
      background: #000;
    }

    .gallery-scroll.landscape {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .gallery-scroll.portrait {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .gallery-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    .gallery-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.5);
      border-radius: 999px;
    }

    .gallery-image {
      flex: 0 0 auto;
      background: #000;
      object-fit: contain;
      transition: transform 0.15s ease;
    }

    .gallery-scroll.landscape .gallery-image {
      height: 100vh; /* fills viewport height */
      width: auto;
    }

    .gallery-scroll.portrait .gallery-image {
      width: 100vw; /* fills viewport width */
      height: auto;
    }

    .gallery-image:hover {
      transform: scale(1.01);
    }

    .gallery-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: auto;
      text-align: center;
      padding: 16px;
    }

    @media (max-width: 640px) {
      .film-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }

      header.app-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .app-right {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header" style="display: none;">
      <div>
        <div class="app-title">Film Library</div>
        <div class="app-subtitle">35mm scans from GitHub › langlaismax/Film</div>
      </div>
      <div class="app-right" id="orientationLabel"></div>
    </header>

    <main>
      <!-- Landing view -->
      <section class="view" id="landingView">
        <div class="landing">
          <div class="status" id="statusText">Loading films from GitHub…</div>
          <div class="film-grid" id="filmGrid"></div>
        </div>
      </section>

      <!-- Gallery view -->
      <section class="view hidden" id="galleryView">
        <div class="gallery-header">
          <button class="back-btn" id="backBtn">
            <span class="chevron">←</span>
            <span>Back</span>
          </button>
          <div class="gallery-title" id="galleryTitle"></div>
          <div class="gallery-subtitle" id="galleryMeta"></div>
        </div>
        <div class="gallery-shell">
          <div class="gallery-scroll" id="galleryScroll"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const OWNER = "langlaismax";
    const REPO  = "Film";
    const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

    const statusText = document.getElementById("statusText");
    const filmGrid = document.getElementById("filmGrid");
    const landingView = document.getElementById("landingView");
    const galleryView = document.getElementById("galleryView");
    const galleryTitle = document.getElementById("galleryTitle");
    const galleryMeta = document.getElementById("galleryMeta");
    const galleryScroll = document.getElementById("galleryScroll");
    const backBtn = document.getElementById("backBtn");
    const orientationLabel = document.getElementById("orientationLabel");

    let logosMap = {};
    let filmFolders = [];
    let currentFolder = null;

    function stripExt(name) {
      return name.replace(/\.[^./]+$/, "");
    }

    function updateOrientationClass() {
      const isLandscape = window.innerWidth > window.innerHeight;
      galleryScroll.classList.toggle("landscape", isLandscape);
      galleryScroll.classList.toggle("portrait", !isLandscape);
      orientationLabel.textContent = isLandscape ? "Layout: Horizontal · full height" :
                                                  "Layout: Vertical · full width";
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} for ${url}`);
      }
      return res.json();
    }

    async function loadRootAndLogos() {
      const [root, logos] = await Promise.all([
        fetchJSON(API_BASE),
        (async () => {
          try {
            return await fetchJSON(`${API_BASE}/logos`);
          } catch (e) {
            // logos folder may not exist yet
            return [];
          }
        })()
      ]);

      // Build logos map: lowercased base filename -> download_url
      logosMap = {};
      for (const item of logos) {
        if (item.type !== "file") continue;
        const base = stripExt(item.name).toLowerCase();
        logosMap[base] = item.download_url;
      }

      // Film folders are all directories except "logos"
      filmFolders = root.filter(
        item => item.type === "dir" && item.name.toLowerCase() !== "logos"
      );

      renderLanding();
    }

    function renderLanding() {
      filmGrid.innerHTML = "";
      if (!filmFolders.length) {
        statusText.textContent = "No film folders found in the repository yet.";
        return;
      }

      statusText.textContent = `Found ${filmFolders.length} film roll${filmFolders.length !== 1 ? "s" : ""}.`;

      for (const folder of filmFolders) {
        const card = document.createElement("button");
        card.className = "film-card";
        card.type = "button";
        card.addEventListener("click", () => openFolder(folder.name));

        const logoWrapper = document.createElement("div");
        logoWrapper.className = "film-logo-wrapper";

        const key = folder.name.toLowerCase();
        const logoUrl = logosMap[key];

        if (logoUrl) {
          const img = document.createElement("img");
          img.src = logoUrl;
          img.alt = folder.name;
          img.className = "film-logo";
          logoWrapper.appendChild(img);
        } else {
          const fallback = document.createElement("div");
          fallback.className = "film-logo-fallback";
          fallback.textContent = folder.name[0]?.toUpperCase() || "?";
          logoWrapper.appendChild(fallback);
        }

        const nameEl = document.createElement("div");
        nameEl.className = "film-name";
        nameEl.textContent = folder.name;

        const metaEl = document.createElement("div");
        metaEl.className = "film-meta";
        metaEl.textContent = "Click to view roll";

        card.appendChild(logoWrapper);
        card.appendChild(nameEl);
        card.appendChild(metaEl);

        filmGrid.appendChild(card);
      }
    }

    async function openFolder(folderName) {
      currentFolder = folderName;
      landingView.classList.add("hidden");
      galleryView.classList.remove("hidden");

      galleryTitle.textContent = folderName;
      galleryMeta.textContent = "Loading…";
      galleryScroll.innerHTML = "";

      updateOrientationClass();

      try {
        const dirUrl = `${API_BASE}/${encodeURIComponent(folderName)}`;
        const items = await fetchJSON(dirUrl);

        const images = items.filter(item =>
          item.type === "file" &&
          /\.(jpe?g|png|webp|gif)$/i.test(item.name)
        );

        if (!images.length) {
          galleryScroll.innerHTML = "";
          const msg = document.createElement("div");
          msg.className = "gallery-empty";
          msg.textContent = "No images found in this folder.";
          galleryScroll.appendChild(msg);
          galleryMeta.textContent = "";
          return;
        }

        galleryScroll.innerHTML = "";
        for (const imgItem of images) {
          const img = document.createElement("img");
          img.src = imgItem.download_url;
          img.alt = imgItem.name;
          img.loading = "lazy";
          img.className = "gallery-image";
          galleryScroll.appendChild(img);
        }

        galleryMeta.textContent = `${images.length} image${images.length !== 1 ? "s" : ""}`;
      } catch (e) {
        console.error(e);
        galleryScroll.innerHTML = "";
        const msg = document.createElement("div");
        msg.className = "gallery-empty";
        msg.textContent = "Error loading images from GitHub.";
        galleryScroll.appendChild(msg);
        galleryMeta.textContent = "";
      }
    }

    function goHome() {
      galleryView.classList.add("hidden");
      landingView.classList.remove("hidden");
      currentFolder = null;
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadRootAndLogos().catch(err => {
        console.error(err);
        statusText.textContent = "Error loading films from GitHub.";
      });

      backBtn.addEventListener("click", goHome);
      window.addEventListener("resize", updateOrientationClass);
      window.addEventListener("orientationchange", updateOrientationClass);
      updateOrientationClass();
    });
  </script>
</body>
</html>
